<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./content/css/css-reset.css">
  <link rel="stylesheet" href="./content/css/theme.css">
  <link rel="stylesheet" href="./content/css/aside.css">
  <link rel="stylesheet" href="./content/css/header.css">
  <link rel="stylesheet" href="./content/css/modal.css">
  <link rel="stylesheet" href="./content/css/pagination.css">
  <title>سفارشات</title>
</head>
<body>
  <div class="layout">
    <div id="asideMount"></div>
    <main class="main">
      <div id="headerMount"></div>
      
<div class="card">
  <div class="h1">سفارشات</div>
  <table class="table">
    <thead><tr><th>محصول</th><th>کاربر</th><th>تاریخ</th><th>ساعت</th><th>قیمت</th><th>تعداد</th><th>عملیات</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="pager"></div>
</div>

<script>
function showErr(err){openModal({ title:'خطا', bodyHTML:`<p style="margin:0;font-weight:900">${err.message}</p>`, confirmText:'باشه' });}
function renderEmptyRow(tbodyId, colCount, message){
  const tb = document.getElementById(tbodyId);
  if(!tb) return;
  tb.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center;padding:18px;font-weight:900" class="muted">${message}</td></tr>`;
}
let state = { page:1, limit:10, q:"" };
const el=(id)=>document.getElementById(id);

function row(o){
  return `<tr>
    <td style="font-weight:1000">${o.productTitle ?? "-"}</td>
    <td>${o.username ?? "-"}</td>
    <td>${o.date ?? "-"}</td>
    <td>${o.hour ?? "-"}</td>
    <td>${Number(o.price ?? 0).toLocaleString("fa-IR")} تومان</td>
    <td>${o.count ?? 1}</td>
    <td><div class="actions"><button class="btn danger" onclick="delItem(${o.id})">حذف</button></div></td>
  </tr>`;
}


async function load(){
  try{
    const data = await apiGet(`/api/orders?q=${encodeURIComponent(state.q)}&page=${state.page}&limit=${state.limit}`);
    if(!data.data.length) renderEmptyRow("tbody", 7, "سفارشاتی یافت نشد");
    else document.getElementById("tbody").innerHTML = data.data.map(row).join("");
    renderPager({ mountId:"pager", page:data.page, totalPages:data.totalPages, limit:data.limit,
      onChange:({page,limit})=>{ state.page=page; state.limit=limit; load(); } });
  }catch(err){showErr(err)}
}

async function delItem(id){
  const ok = await confirmModal({ title:"حذف سفارش", message:"مطمئنی سفارش حذف شود؟", confirmText:"حذف" });
  if(!ok) return;
  try{ await apiSend(`/api/orders/${id}`,"DELETE"); load(); }catch(err){showErr(err)}
}


document.addEventListener("click",(e)=>{
  if(e.target?.id==="btnSearch"){ state.q=el("q").value.trim(); state.page=1; load(); }
});
load();
</script>

    </main>
  </div>

  <script src="./content/js/components.js"></script>
  <script src="./content/js/api.js"></script>
  <script src="./content/js/modal.js"></script>
  <script src="./content/js/pagination.js"></script>
  <script>
    (async ()=>{
      await bootLayout("orders");
      setHeaderSubtitle("مدیریت سفارشات");
    })();
  </script>
</body>
</html>
